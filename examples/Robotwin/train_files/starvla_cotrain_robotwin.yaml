# Basic release configuration, not a tuned benchmark recipe.
# Keep memory length = group size; batch size must be a multiple of group size.
run_id: robotwin_geomem_basic
run_root_dir: results/Checkpoints
seed: 42
wandb_entity: null
wandb_project: geomem-vla
is_debug: false
version_id: '0.21'
framework:
  name: QwenGeoGR00T
  qwenvl:
    base_vlm: ${oc.env:BASE_VLM,/path/to/Qwen3-VL-4B-Instruct}
    attn_implementation: sdpa
    vl_hidden_dim: 2048
  dino:
    dino_backbone: dinov2_vits14
  action_model:
    action_model_type: DiT-B
    hidden_size: 1024
    add_pos_embed: true
    max_seq_len: 1024
    action_dim: 14
    state_dim: 14
    action_horizon: 50
    repeated_diffusion_steps: 8
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    num_timestep_buckets: 1000
    num_inference_timesteps: 16
    num_target_vision_tokens: 32
    diffusion_model_cfg:
      dropout: 0.2
      final_dropout: true
      interleave_self_attention: true
      norm_type: ada_norm
      num_layers: 16
      output_dim: 2560
      positional_embeddings: null
  geoplan:
    use_geoplan: true
    use_geo_aux: true
    use_memory: true
    geo_bridge_type: inseq_token
    action_context_type: compressed
    geo_supervise: raw
    use_eef_endpose: false
    eef_arms: 2
    eef_target_mode: rel
    eef_waypoint_scale: 1.0
    geo_num_queries: 16
    geo_work_dim: 512
    per_num_tokens: 64
    per_resampler_layers: 2
    geo_grid_size: 16
    geo_head_hidden: 512
    geo_head_depth: 4
    geo_head_heads: 8
    lambda_cur: 0.5
    lambda_fut: 1.0
    lambda_eef: 0.0
    geo_loss_coeff: 0.1
    geo_normalize_pts: true
    geo_diag_interval: 0
    geo_use_future: false
    geo_flow_stride: 5
    geo_vggt_ckpt: ${oc.env:VGGT_CKPT,null}
    geo_vggt_repo_path: ${oc.env:VGGT_REPO,null}
    geo_vggt_img_size: 336
    mem_length: 16
    retrieval_layers: 2
    use_timestep_pe: true
    fusion_type: gate
    consolidate_type: tome
    update_fused: false
    causal_retrieval: true
    validate_group_layout: true
    dataloader_type: group
    group_size: 16
    eval_memory_mode: stateless
datasets:
  vla_data:
    dataset_py: lerobot_datasets
    include_state: true
    data_root_dir: ${oc.env:ROBOTWIN_DATA_ROOT,/path/to/dataset}
    data_mix: robotwin_all_50_q99
    action_type: abs_qpos
    action_mode: abs
    sequential_step_sampling: true
    group_sampling_mode: random_sorted
    group_size: 16
    per_device_batch_size: 16
    load_all_data_for_training: true
    obs_image_size:
    - 224
    - 224
    video_backend: pyav
    balance_dataset_weights: true
    num_workers: 4
    prefetch_factor: 2
trainer:
  max_train_steps: 20000
  num_warmup_steps: 100
  save_interval: 1000
  eval_interval: 100
  learning_rate:
    base: 2.5e-05
    qwen_vl_interface: 1.0e-05
    action_model: 0.0001
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  freeze_modules: ''
  loss_scale:
    vla: 1.0
    vlm: 0.1
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 10
  gradient_clipping: 1.0
  gradient_accumulation_steps: 8
  gradient_checkpointing: true
  optimizer:
    name: AdamW
    betas:
    - 0.9
    - 0.95
    eps: 1.0e-08
    weight_decay: 1.0e-08
