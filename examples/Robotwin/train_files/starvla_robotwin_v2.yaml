# Optional RoboTwin research configuration: EEF-in-point-cloud geometry target ("Strategy A").
# Not the basic release recipe. It is the basic recipe (starvla_cotrain_robotwin.yaml) with:
#   * framework QwenGeoGR00T_RoboTwin and dataset mixture robotwin_all_50_v2, whose DataConfig
#     also exposes the observation.eef and observation.campose columns;
#   * the future dual-arm EEF track mapped into the VGGT point-map frame (world -> camera with the
#     per-frame extrinsic, projected with the intrinsic, metric -> VGGT scale from the VGGT depth at
#     the gripper pixels) and normalized jointly with the point map; lambda_eef weights that segment;
#   * memory length = group size = 8 and a second-difference action smoothness loss.
# Data preparation (add_eef_to_lerobot.py, add_campose_to_lerobot.py): see examples/Robotwin/README.md.
# batch size must be a multiple of group size.
run_id: robotwin_geomem_eef_pointcloud
run_root_dir: results/Checkpoints
seed: 42
wandb_entity: null
wandb_project: geomem-vla
is_debug: false
version_id: '0.21'
framework:
  name: QwenGeoGR00T_RoboTwin
  qwenvl:
    base_vlm: ${oc.env:BASE_VLM,/path/to/Qwen3-VL-4B-Instruct}
    attn_implementation: sdpa
    vl_hidden_dim: 2048
  action_model:
    action_model_type: DiT-B
    hidden_size: 1024
    add_pos_embed: true
    max_seq_len: 1024
    action_dim: 14
    state_dim: 14
    action_horizon: 50
    repeated_diffusion_steps: 8
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    num_timestep_buckets: 1000
    num_inference_timesteps: 16
    action_smooth_coeff: 0.05
    num_target_vision_tokens: 32
    diffusion_model_cfg:
      dropout: 0.2
      final_dropout: true
      interleave_self_attention: true
      norm_type: ada_norm
      num_layers: 16
      output_dim: 2560
      positional_embeddings: null
  geoplan:
    use_geoplan: true
    use_geo_aux: true
    use_memory: true
    geo_bridge_type: inseq_token
    action_context_type: compressed
    geo_supervise: raw
    use_eef_endpose: true
    eef_arms: 2
    geo_eef_anchor_steps: 4
    geo_eef_min_depth: 0.05
    geo_eef_scale_clip: 4.0
    geo_num_queries: 16
    geo_work_dim: 512
    obs1_num_tokens: 64
    obs1_resampler_layers: 2
    geo_grid_size: 16
    geo_head_hidden: 512
    geo_head_depth: 4
    geo_head_heads: 8
    lambda_cur: 0.5
    lambda_fut: 1.0
    lambda_eef: 3.0
    geo_loss_coeff: 0.1
    geo_normalize_pts: true
    geo_diag_interval: 100
    geo_use_future: false
    geo_flow_stride: 5
    geo_vggt_ckpt: ${oc.env:VGGT_CKPT,null}
    geo_vggt_repo_path: ${oc.env:VGGT_REPO,null}
    geo_vggt_img_size: 336
    mem_length: 8
    retrieval_layers: 2
    use_timestep_pe: true
    fusion_type: gate
    consolidate_type: tome
    update_fused: false
    causal_retrieval: true
    validate_group_layout: true
    dataloader_type: group
    group_size: 8
    eval_memory_mode: stateless
datasets:
  vla_data:
    dataset_py: lerobot_datasets
    include_state: true
    data_root_dir: ${oc.env:ROBOTWIN_DATA_ROOT,/path/to/dataset}
    data_mix: robotwin_all_50_v2
    action_type: abs_qpos
    action_mode: abs
    sequential_step_sampling: true
    group_sampling_mode: random_sorted
    group_size: 8
    per_device_batch_size: 8
    load_all_data_for_training: true
    obs_image_size:
    - 224
    - 224
    video_backend: pyav
    balance_dataset_weights: true
    num_workers: 4
    prefetch_factor: 2
trainer:
  max_train_steps: 20000
  num_warmup_steps: 100
  save_interval: 1000
  eval_interval: 100
  learning_rate:
    base: 2.5e-05
    qwen_vl_interface: 1.0e-05
    action_model: 0.0001
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  freeze_modules: ''
  loss_scale:
    vla: 1.0
    vlm: 0.1
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 10
  gradient_clipping: 1.0
  gradient_accumulation_steps: 8
  gradient_checkpointing: true
  optimizer:
    name: AdamW
    betas:
    - 0.9
    - 0.95
    eps: 1.0e-08
    weight_decay: 1.0e-08
